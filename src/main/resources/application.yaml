server:
  port: 8081

spring:
  application:
    name: gen-ai-java-spring
  ai:
    openai:
      api-key: dummy-string
      base-url: http://localhost:12434/engines/llama.cpp
      chat:
        options:
          model: ai/gemma3:4b
    hugginface:
      chat:
        api-key: ${Hugging_Face_Token}
        url:
        options:
            model: Qwen/Qwen2.5-Coder-7B-Instruct
            max-new-tokens: 1024
            temperature: 0.7
    Ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:1b
          max-new-token: 512
          temperature : 0.7

logging:
  level:
    root: INFO
    com.geni.java.spring: INFO
    org.springframework.ai: INFO
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG